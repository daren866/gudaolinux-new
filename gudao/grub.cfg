set default=0
set timeout=5

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "Gudao Linux" {
	linux /boot/vmlinuz-gudao console=tty0 console=ttyS0,115200
	initrd /boot/initramfs-gudao.img
}

menuentry "Gudao Linux (display only)" {
	linux /boot/vmlinuz-gudao console=tty0
	initrd /boot/initramfs-gudao.img
}

menuentry "Gudao Linux (serial console)" {
	linux /boot/vmlinuz-gudao console=ttyS0,115200
	initrd /boot/initramfs-gudao.img
}
