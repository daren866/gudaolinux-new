# Gudao Linux boot menu (GRUB 2)
# Default: quiet display-only boot (no kernel log on screen).
# Pick the entries below manually if you need the kernel log.
set default=0
set timeout=5

# ---- default: quiet display-only boot, no kernel log ----
# gfxpayload: leave GRUB in a VESA graphics mode so the kernel always has a
# framebuffer (simpledrm -> /dev/dri/card0 + /dev/fb0) even when no GPU
# specific KMS driver matches the VM's virtual VGA.
menuentry "Gudao Linux (display only - default)" {
    insmod all_video
    set gfxpayload=1024x768x32,1024x768,auto
    linux /boot/vmlinuz-gudao console=tty0 quiet loglevel=3
    initrd /boot/initramfs-gudao.img
}

# ---- manual: pick one of these to watch the kernel log ----
menuentry "Gudao Linux (console + serial, with kernel log)" {
    linux /boot/vmlinuz-gudao console=tty0 console=ttyS0,115200n8
    initrd /boot/initramfs-gudao.img
}

menuentry "Gudao Linux (nomodeset, safe graphics, with kernel log)" {
    linux /boot/vmlinuz-gudao console=tty0 console=ttyS0,115200n8 nomodeset
    initrd /boot/initramfs-gudao.img
}
