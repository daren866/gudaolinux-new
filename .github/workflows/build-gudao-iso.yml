name: Build Gudao Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'gudao/**'
      - 'include/linux/uts.h'
      - 'init/version-timestamp.c'
      - 'Kconfig'
  pull_request:
    branches: [ main ]
    paths:
      - 'gudao/**'
      - '.github/workflows/**'

concurrency:
  group: build-gudao-iso
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Gudao Linux kernel + BusyBox + GRUB ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Gudao Linux source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            cpio gzip wget qemu-system-x86 \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools

      - name: Verify Gudao branding
        run: |
          echo "==> uname sysname:"
          grep 'UTS_SYSNAME' include/linux/uts.h
          echo "==> boot banner:"
          grep -n 'version ' init/version-timestamp.c | head -2
          echo "==> menuconfig title:"
          grep 'mainmenu' Kconfig

      - name: Configure kernel (defconfig + Gudao fragment)
        run: |
          make defconfig
          scripts/kconfig/merge_config.sh -m .config gudao/gudao-kernel.config
          make olddefconfig
          echo "==> key config check:"
          grep -E 'CONFIG_(LOCALVERSION=|KEYBOARD_ATKBD=|SERIO_I8042=|VT=|BLK_DEV_INITRD=|DEVTMPFS=|SERIAL_8250_CONSOLE=)' .config
          echo "==> network config check (e1000 + DHCP stack):"
          grep -E 'CONFIG_(E1000=|E1000E=|NET=|INET=|PACKET=)' .config
          # fail the build if e1000 is not built-in (initramfs ships no modules)
          grep -q '^CONFIG_E1000=y' .config || { echo 'CONFIG_E1000=y missing!'; exit 1; }
          echo "==> graphics config check (KMS drivers + firmware fb fallback):"
          grep -E 'CONFIG_(DRM=|DRM_BOCHS=|DRM_CIRRUS_QEMU=|DRM_QXL=|DRM_VIRTIO_GPU=|DRM_VMWGFX=|DRM_VBOXVIDEO=|DRM_SIMPLEDRM=|SYSFB_SIMPLEFB=|FB_VESA=|FB_EFI=|FRAMEBUFFER_CONSOLE=)' .config || true
          # fail the build if core graphics are not built-in (initramfs ships no
          # modules); catches typo'd symbol names silently dropped by olddefconfig
          for sym in DRM=y DRM_BOCHS=y DRM_CIRRUS_QEMU=y DRM_QXL=y DRM_VIRTIO_GPU=y DRM_VMWGFX=y DRM_VBOXVIDEO=y DRM_SIMPLEDRM=y SYSFB_SIMPLEFB=y FB_VESA=y FRAMEBUFFER_CONSOLE=y; do
            grep -q "^CONFIG_$sym" .config || { echo "CONFIG_$sym missing! (typo or symbol removed from kernel?)"; exit 1; }
          done

      - name: Build kernel (bzImage)
        run: |
          make -j"$(nproc)" bzImage
          cp arch/x86/boot/bzImage vmlinuz-gudao
          file vmlinuz-gudao

      - name: Build BusyBox (static, from repo source with Gudao applets)
        run: |
          cd busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # tc applet breaks with kernel headers >= 6.8 (struct tc_cbq_wrropt removed)
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          # Gudao applets (calc, about) are default-y; make it explicit
          sed -i 's/^# CONFIG_CALC is not set/CONFIG_CALC=y/' .config
          sed -i 's/^# CONFIG_ABOUT is not set/CONFIG_ABOUT=y/' .config
          # udhcpc (DHCP client) + ifconfig/route/ip for boot-time networking
          sed -i 's/^# CONFIG_UDHCPC is not set/CONFIG_UDHCPC=y/' .config
          # build the binary only (docs were stripped from the repo copy)
          make -j"$(nproc)" busybox
          file busybox
          echo "==> required applets:"
          for a in calc about udhcpc ifconfig route ip; do
            ./busybox --list | grep -qx "$a" || { echo "  applet $a MISSING"; exit 1; }
            echo "  $a: OK"
          done
          echo "==> smoke test: calc / about"
          ./busybox calc '2*(2+2)'
          ./busybox about

      - name: Build Gudao desktop pack (Xorg + XFCE from Debian trixie)
        run: bash gudao/build-desktop-pack.sh

      - name: Build initramfs
        run: bash gudao/build-initramfs.sh

      - name: Build ISO (GRUB)
        run: |
          # validate grub.cfg syntax before packing (default entry is quiet display-only)
          grub-script-check gudao/grub.cfg && echo "grub.cfg syntax OK"
          bash gudao/build-iso.sh

      - name: Boot test (QEMU headless)
        run: |
          # NOTE: the ISO's default GRUB entry is now quiet display-only (no serial
          # output), so we verify the console=ttyS0 boot path by direct kernel boot.
          # -m 2048: the initramfs now embeds the ~150MB desktop pack.
          set +e
          timeout 240 qemu-system-x86_64 -m 2048M -nographic -no-reboot \
            -kernel vmlinuz-gudao \
            -initrd initramfs-gudao.img \
            -append "console=ttyS0 panic=-1" \
            </dev/null > boot.log 2>&1
          RC=$?
          set -e
          echo "qemu exit code: $RC (124 = killed by timeout, expected)"
          if grep -q "Welcome to Gudao Linux" boot.log; then
            echo "============================================"
            echo " BOOT TEST PASSED - Gudao Linux is alive!"
            echo "============================================"
            grep -m1 "Gudao Linux version" boot.log || true
            tail -15 boot.log
          else
            echo " BOOT TEST FAILED - last 60 lines of boot.log:"
            tail -60 boot.log
            exit 1
          fi

      - name: Self-test calc / about / network (QEMU)
        run: |
          set +e
          timeout 180 qemu-system-x86_64 -m 2048M -nographic -no-reboot \
            -kernel vmlinuz-gudao \
            -initrd initramfs-gudao.img \
            -device e1000,netdev=net0 -netdev user,id=net0 \
            -append "console=ttyS0 gudao_selftest panic=-1" \
            </dev/null > selftest.log 2>&1
          RC=$?
          set -e
          echo "qemu exit code: $RC"
          tail -40 selftest.log
          FAIL=0
          grep -q "CALC PASS"        selftest.log || { echo "  calc selftest FAILED";    FAIL=1; }
          grep -q "system: Gudao Linux" selftest.log || { echo "  about(system) FAILED";  FAIL=1; }
          grep -q "^kernel: Linux"   selftest.log || { echo "  about(kernel) FAILED";  FAIL=1; }
          grep -q "^ram: "           selftest.log || { echo "  about(ram) FAILED";     FAIL=1; }
          grep -q "^cpu: "           selftest.log || { echo "  about(cpu) FAILED";     FAIL=1; }
          grep -q "NET PASS"         selftest.log || { echo "  net selftest FAILED";   FAIL=1; }
          grep -q "DNS PASS"         selftest.log || { echo "  dns selftest FAILED";   FAIL=1; }
          if [ "$FAIL" = "0" ]; then
            echo "=============================================="
            echo " CALC/ABOUT/NETWORK SELFTEST PASSED"
            echo "=============================================="
          else
            exit 1
          fi

      - name: Desktop test (QEMU, Xorg + xfwm4 + panel + xfdesktop + thunar + xfce4-terminal)
        run: |
          # Boots with gudao_desktoptest: unpacks the desktop pack, starts
          # Xorg (Mesa llvmpipe CPU rendering), xfwm4, xfce4-panel, xfdesktop,
          # thunar and xfce4-terminal, verifies all processes + glxinfo,
          # powers off.
          set +e
          timeout 900 qemu-system-x86_64 -m 2048M -nographic -no-reboot \
            -kernel vmlinuz-gudao \
            -initrd initramfs-gudao.img \
            -device e1000,netdev=net0 -netdev user,id=net0 \
            -append "console=ttyS0 gudao_desktoptest panic=-1" \
            </dev/null > desktop.log 2>&1
          RC=$?
          set -e
          echo "qemu exit code: $RC"
          tail -70 desktop.log
          if grep -q "DESKTOP PASS" desktop.log && grep -q "MESA CPU RENDER (llvmpipe): PASS" desktop.log \
             && grep -q "PANEL WINDOW: PASS" desktop.log && grep -q "MIME database: OK" desktop.log; then
            echo "=============================================="
            echo " DESKTOP TEST PASSED - Gudao GUI is alive!"
            echo "=============================================="
          else
            echo " DESKTOP TEST FAILED"
            exit 1
          fi

      - name: Desktop test - qxl vga (QEMU, virt-manager/SPICE default GPU)
        run: |
          # virt-manager / SPICE users get the qxl GPU by default; verify the
          # desktop also comes up there (DRM_QXL must provide /dev/dri/card0).
          set +e
          timeout 900 qemu-system-x86_64 -m 2048M -nographic -no-reboot \
            -vga qxl \
            -kernel vmlinuz-gudao \
            -initrd initramfs-gudao.img \
            -device e1000,netdev=net0 -netdev user,id=net0 \
            -append "console=ttyS0 gudao_desktoptest panic=-1" \
            </dev/null > desktop-qxl.log 2>&1
          RC=$?
          set -e
          echo "qemu exit code: $RC"
          tail -50 desktop-qxl.log
          if grep -q "DESKTOP PASS" desktop-qxl.log && grep -q "MESA CPU RENDER (llvmpipe): PASS" desktop-qxl.log \
             && grep -q "PANEL WINDOW: PASS" desktop-qxl.log && grep -q "MIME database: OK" desktop-qxl.log; then
            echo "=============================================="
            echo " DESKTOP TEST (qxl) PASSED"
            echo "=============================================="
          else
            echo " DESKTOP TEST (qxl) FAILED"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gudao-linux-iso
          if-no-files-found: error
          path: |
            gudao-linux-*.iso
            vmlinuz-gudao
            initramfs-gudao.img

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KVER="$(make -s kernelversion)"
          TAG="gudao-${KVER}-r${GITHUB_RUN_NUMBER}"
          TITLE="Gudao Linux ${KVER} (build #${GITHUB_RUN_NUMBER})"
          NOTES="Gudao Linux ${KVER} - auto-built bootable ISO.

          - Bootloader: GRUB 2 (BIOS + UEFI hybrid), quiet display-only boot by default
          - Userland: BusyBox shell with Gudao applets (live in RAM)
          - Built-in commands: calc <expr>, about, desktop (start the GUI)
          - Desktop: type 'desktop' -> Xorg (Mesa llvmpipe CPU rendering)
            + xfwm4 + xfce4-panel + xfdesktop + thunar + xfce4-terminal
          - Network: Intel e1000/e1000e driver built-in, auto DHCP at boot, DNS 8.8.8.8
          - Keyboard/mouse: PS/2, USB HID, VMware vmmouse; libinput under X
          - GPU drivers built-in: QEMU (bochs/cirrus/qxl/virtio), VMware (vmwgfx),
            VirtualBox (vboxvideo + VMSVGA), plus a VESA/EFI framebuffer fallback
            (simpledrm) so the desktop also works with any other virtual GPU
          - RAM advice: 2 GB minimum (the whole system incl. the desktop lives in RAM)
          - Boot test: passed headless in QEMU (incl. calc/about/network/desktop selftest)

          How to use:
          1. Download gudao-linux-${KVER}.iso
          2. Burn to CD/USB or attach to a VM as CD-ROM (2 GB RAM recommended)
          3. Default boots silently (no kernel log) into the busybox shell.
             For kernel log, pick a 'with kernel log' entry in the GRUB menu.
          4. Type 'desktop' to start the X desktop (first run unpacks the
             desktop pack, ~1 minute; look at your VM's GUI display, vt1).
          5. Network comes up automatically via DHCP; DNS resolver is 8.8.8.8.

          Try in the shell:
            calc 2*(2+2)     -> 8
            about            -> system / kernel / ram / cpu info
            desktop          -> Xorg + xfwm4 + xfce4-panel + xfdesktop
                                + thunar + xfce4-terminal
            ifconfig         -> see the DHCP-assigned address
            cat /etc/resolv.conf  -> nameserver 8.8.8.8"
          gh release create "$TAG" \
            "gudao-linux-${KVER}.iso" \
            vmlinuz-gudao \
            initramfs-gudao.img \
            --title "$TITLE" \
            --notes "$NOTES"
          echo ">>> Release published: $TAG"
